{% extends 'appointments/base.html' %}

{% block content %}
<div class="form-container">
    <h2>Login</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Login</button>
    </form>
    <p>Do not have an account? <a href="/register/">Register here</a></p>
</div>
{% endblock %}
