{% extends 'appointments/base.html' %}

{% block content %}
<div class="form-container">
    <h2>Create Account</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Register</button>
    </form>
    <p>Already have an account? <a href="/login/">Login here</a></p>
</div>
{% endblock %}
